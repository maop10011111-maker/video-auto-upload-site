name: YouTube Auto Upload

on:
  push:
    branches: [main]
    paths:
      - ".automation/youtube-trigger.txt"
  schedule:
    - cron: "30 8,14 * * *"
    - cron: "35 8,14 * * *"
    - cron: "40 8,14 * * *"
    - cron: "45 8,14 * * *"

concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine posting slot
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          output=os.environ["GITHUB_OUTPUT"]
          event=os.getenv("EVENT_NAME","")
          message=os.getenv("COMMIT_MESSAGE","")
          run_id=os.getenv("RUN_ID","")
          if event == "push" and "One-time immediate YouTube upload" in message:
              with open(output,"a",encoding="utf-8") as f:
                  f.write("due=true\n")
                  f.write(f"slot=one-time-{run_id}\n")
              raise SystemExit(0)
          ist=timezone(timedelta(hours=5,minutes=30))
          now=datetime.now(timezone.utc).astimezone(ist)
          target_hours={14,20}
          if now.hour in target_hours: slot_hour=now.hour
          elif (now.hour-1) in target_hours: slot_hour=now.hour-1
          else:
              with open(output,"a",encoding="utf-8") as f: f.write("due=false\nslot=none\n")
              raise SystemExit(0)
          slot=f"{now:%Y-%m-%d}-{slot_hour:02d}"
          with open(output,"a",encoding="utf-8") as f:
              f.write("due=true\n")
              f.write(f"slot={slot}\n")
          PY
      - name: Checkout repository
        if: steps.slot.outputs.due == 'true'
        uses: actions/checkout@v4
      - name: Check whether this slot already uploaded
        id: slot_cache
        if: steps.slot.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .youtube-slot-marker
          key: youtube-slot-${{ steps.slot.outputs.slot }}
      - name: Set up Python
        if: steps.slot.outputs.due == 'true' && steps.slot_cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        if: steps.slot.outputs.due == 'true' && steps.slot_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Install dependencies
        if: steps.slot.outputs.due == 'true' && steps.slot_cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Run YouTube automation
        id: run
        if: steps.slot.outputs.due == 'true' && steps.slot_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READY_FOLDER_ID: ${{ secrets.READY_FOLDER_ID }}
          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
        run: |
          set +e
          python main.py 2>&1 | tee youtube_run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -q "YouTube upload successful." youtube_run.log; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          elif grep -q "No videos found in READY folder." youtube_run.log; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "READY folder is empty; nothing to upload."
          else
            echo "YouTube automation ended without confirmed upload or empty-folder result."
            exit 1
          fi
      - name: Mark posting slot complete
        if: steps.run.outputs.uploaded == 'true'
        run: echo "${{ steps.slot.outputs.slot }}" > .youtube-slot-marker
      - name: Save completed posting slot
        if: steps.run.outputs.uploaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: .youtube-slot-marker
          key: youtube-slot-${{ steps.slot.outputs.slot }}
      - name: Slot already completed
        if: steps.slot.outputs.due == 'true' && steps.slot_cache.outputs.cache-hit == 'true'
        run: echo "This YouTube posting slot already succeeded."
