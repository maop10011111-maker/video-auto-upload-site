name: YouTube Auto Upload

on:
  repository_dispatch:
    types: [telegram_youtube]

concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set Telegram trigger slot
        id: slot
        shell: bash
        run: |
          echo "slot=telegram-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether this command already uploaded
        id: slot_cache
        uses: actions/cache/restore@v4
        with:
          path: .youtube-slot-marker
          key: youtube-slot-${{ steps.slot.outputs.slot }}

      - name: Set up Python
        if: steps.slot_cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        if: steps.slot_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Install dependencies
        if: steps.slot_cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run YouTube automation
        id: run
        if: steps.slot_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READY_FOLDER_ID: ${{ secrets.READY_FOLDER_ID }}
          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
        run: |
          set +e
          : > youtube_run.log
          status=1

          for attempt in 1 2 3; do
            echo "YouTube automation attempt ${attempt}/3"
            : > youtube_attempt.log
            python main.py 2>&1 | tee youtube_attempt.log | tee -a youtube_run.log
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 0 ]; then
              break
            fi

            if grep -q "Could not obtain a complete valid video from Drive" youtube_attempt.log && [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 45))
              echo "Drive returned a temporary/partial copy. Waiting ${wait_seconds}s before a fresh download attempt..." | tee -a youtube_run.log
              sleep "$wait_seconds"
              continue
            fi

            break
          done

          rm -f youtube_attempt.log

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          if grep -q "YouTube upload successful." youtube_run.log; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          elif grep -q "No videos found in READY folder." youtube_run.log; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "READY folder is empty; nothing to upload."
          else
            echo "YouTube automation ended without confirmed upload or empty-folder result."
            exit 1
          fi

      - name: Mark Telegram command complete
        if: steps.run.outputs.uploaded == 'true'
        run: echo "${{ steps.slot.outputs.slot }}" > .youtube-slot-marker

      - name: Save completed Telegram command
        if: steps.run.outputs.uploaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: .youtube-slot-marker
          key: youtube-slot-${{ steps.slot.outputs.slot }}

      - name: Command already completed
        if: steps.slot_cache.outputs.cache-hit == 'true'
        run: echo "This Telegram-triggered YouTube command already succeeded."
